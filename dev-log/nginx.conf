worker_processes 1;
error_log /var/log/nginx/error.log warn;
events { worker_connections 256; }

http {
    # Formato combined — exatamente o que app/pipeline/stage1_parse.py espera.
    log_format combined_fmt '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

    # NÃO use /var/log/nginx/access.log aqui. A imagem oficial do nginx cria esse
    # caminho como symlink para /dev/stdout, para o log sair no `docker logs`. O
    # volume compartilhado herda o symlink, o nginx escreve no stdout e o detector
    # fica observando um link que nunca recebe byte nenhum — sem erro em lugar
    # algum. Um nome próprio evita o symlink e continua casando com o glob
    # `*access*.log`.
    access_log /var/log/nginx/app-access.log combined_fmt;

    # O simulador manda requisições em nome de IPs falsos via X-Forwarded-For.
    # Sem isto, tudo apareceria vindo do mesmo IP do container e as features de
    # janela por IP — que são 5 das 35 dimensões — não teriam sentido nenhum.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Responde a qualquer coisa: o objetivo é gerar log, não servir um site.
        # Os códigos abaixo imitam o que um alvo real devolveria para cada sonda.
        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            default_type application/json;
            return 200 '{"ok":true}';
        }

        location /login {
            default_type application/json;
            return 401 '{"error":"credenciais invalidas"}';
        }

        location /admin {
            return 403;
        }

        location ~ \.(php|asp|aspx|jsp|cgi)$ {
            return 404;
        }

        location ~ /\. {
            return 403;
        }
    }
}
