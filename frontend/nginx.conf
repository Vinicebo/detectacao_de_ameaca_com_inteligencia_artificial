# Serve o build do dashboard e faz proxy para a API.
#
# Um só domínio para as duas coisas evita CORS e mantém o WebSocket na mesma
# origem — o navegador não trata `ws://` para outro host como same-origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets do Vite têm hash no nome — podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # O feed manda heartbeat a cada 30s; o timeout precisa ser maior que isso
        # ou o proxy derruba a conexão entre um ping e outro.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
