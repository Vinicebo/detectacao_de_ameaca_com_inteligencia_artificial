name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: detector
          POSTGRES_PASSWORD: detector
          POSTGRES_DB: detector_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detector"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://detector:detector@localhost:5432/detector_test
      REDIS_URL: redis://localhost:6379/0
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        # A roda CPU do torch evita baixar ~2 GB de CUDA que a CI nunca usa.
        run: |
          uv venv
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match ".[train,dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos
        run: uv run mypy app

      - name: Testes
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
