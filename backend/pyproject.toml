[project]
name = "threat-detector"
version = "0.1.0"
description = "AI-powered threat detection engine for nginx access logs"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "orjson>=3.10",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.2",
    "scikit-learn>=1.6",
    "onnxruntime>=1.20",
    "geoip2>=4.8",
]

[project.optional-dependencies]
# Só o container que treina precisa disso. A inferência usa apenas onnxruntime,
# que é ordens de magnitude mais leve que o torch.
train = [
    "torch>=2.5",
    "onnx>=1.17",
    # A partir do torch 2.9 o exportador ONNX padrão é o baseado em dynamo, que
    # importa onnxscript. Sem esta linha, torch.onnx.export falha com
    # ModuleNotFoundError — e só na hora de exportar, depois de o treino inteiro
    # já ter rodado.
    "onnxscript>=0.1",
    "skl2onnx>=1.17",
    "mlflow>=2.19",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Mesma razão do cache_dir do pytest: /app é montado do host e pertence ao root,
# enquanto o processo roda como `detector`.
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert é idiomático em testes
    "B008",  # Depends() no default é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "N806", "N803"]
# `X` para matriz de features e `y` para rótulos é convenção universal em ML,
# vinda da notação matemática. Renomear para `x`/`y_` deixaria o código mais
# difícil de ler para quem vem de scikit-learn, não mais fácil.
"app/ml/*.py" = ["N806", "N803"]
# random não-criptográfico é adequado aqui: gerar dados de treino e amostrar
# eventos LOW não são decisões de segurança.
"app/ml/synthetic.py" = ["S311", "N806", "N803"]
"app/pipeline/stage4_dispatch.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
cache_dir = "/tmp/.mypy_cache"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoip2.*", "skl2onnx.*", "onnxruntime.*", "sklearn.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# /app é montado do host e pertence ao root; o processo roda como `detector` e
# não consegue escrever o cache lá.
cache_dir = "/tmp/.pytest_cache"
addopts = "-q --strict-markers"
markers = [
    "integration: exige Postgres e Redis rodando",
    "slow: treina modelo de verdade (segundos, nao milissegundos)",
]
