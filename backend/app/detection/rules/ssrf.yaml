# Server-side request forgery
#
# O sinal é um parâmetro carregando URL que aponta para dentro da própria
# infraestrutura. Endpoint de metadados de nuvem (169.254.169.254) é o alvo
# clássico: quem chega lá lê credencial de instância.

rules:
  - id: SSRF-001
    category: ssrf
    severity: critical
    score: 0.95
    description: Endpoint de metadados de nuvem (AWS/GCP/Azure/Alibaba)
    targets: [uri, referer]
    pattern: '(169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.com|100\.100\.100\.200|/latest/meta-data|/computemetadata/)'

  - id: SSRF-002
    category: ssrf
    severity: high
    score: 0.85
    description: URL em parâmetro apontando para loopback
    targets: [query]
    pattern: '(https?|ftp|gopher|dict|ldap)\s*:\s*/\s*/\s*(127(\.\d{1,3}){3}|localhost|0\.0\.0\.0|\[?::1\]?|0x7f[0-9a-f]{6}|2130706433)'

  - id: SSRF-003
    category: ssrf
    severity: high
    score: 0.8
    description: URL em parâmetro apontando para rede privada (RFC 1918)
    targets: [query]
    pattern: '(https?|ftp|gopher|dict)\s*:\s*/\s*/\s*(10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2}|169\.254(\.\d{1,3}){2})'

  - id: SSRF-004
    category: ssrf
    severity: high
    score: 0.85
    description: Protocolo exótico usado para SSRF (gopher, dict, ldap)
    targets: [query]
    pattern: '\b(gopher|dict|tftp|ftp|sftp|ldap|jar|netdoc)\s*:\s*/\s*/'

  # Escore ABAIXO do limiar de MEDIUM, de propósito. `?redirect_uri=https://...`
  # é o fluxo normal de OAuth e `?image_url=` é proxy de imagem legítimo — quem
  # decide se há SSRF é o destino da URL (SSRF-001 a SSRF-003), não a presença de
  # uma URL em parâmetro.
  #
  # 0.4 e não 0.5: em 0.5 a regra alcançava o limiar de MEDIUM e passava a
  # habilitar o bônus de concordância do ensemble. Um OAuth legítimo, com o
  # modelo achando o caminho incomum, somava 0.5 + 0.1 e virava HIGH. Sinal de
  # apoio não pode ser evidência suficiente para o bônus.
  - id: SSRF-005
    category: ssrf
    severity: low
    score: 0.4
    description: Parâmetro típico de proxy carregando URL absoluta
    targets: [query]
    pattern: '\b(url|uri|link|src|dest|destination|redirect|redirect_uri|next|target|proxy|fetch|load|domain|host|site|page|feed|callback|continue|return|returnto|return_url|image_url|file_url)\s*=\s*(https?|ftp)\s*:\s*/\s*/'

  - id: SSRF-006
    category: ssrf
    severity: medium
    score: 0.75
    description: Redirecionamento aberto por barra dupla ou barra invertida
    targets: [query]
    pattern: '\b(redirect|redirect_uri|next|return|returnto|continue|goto|dest|destination|url)\s*=\s*(/{2,}|\\{2,}|%2f%2f|%5c%5c)\w'
